<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pi Desk für Windows</title>
<link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/features.css">
</head>
<body>
<div class="app">
 <aside class="sidebar" aria-label="Projekte"><div class="side-top"><button class="icon" data-action="search" data-icon="search" aria-label="Aufgaben suchen" data-tip="Suchen · Strg+K"></button><button class="icon" data-action="new" data-icon="compose" aria-label="Neue Aufgabe" data-tip="Neue Aufgabe"></button></div><div class="brand"><svg viewBox="0 0 24 24"><path d="M4 6h16M9 6 7 19m10-13-2 10q-.4 3 3 3"/></svg>Pi Desk</div><div class="side-nav"><div class="side-section">Projekte<button class="icon" data-action="add-project" data-icon="plus" aria-label="Projekt öffnen" data-tip="Projekt hinzufügen"></button></div><nav id="projects"></nav></div><div class="side-bottom"><button class="icon" data-action="settings" data-icon="settings" aria-label="Einstellungen" data-tip="Einstellungen"></button><span class="demo">OMP · Lokal</span><button class="icon" data-action="about" data-icon="person" aria-label="Anbieter verbinden" data-tip="Anbieter verbinden"></button></div></aside>
 <main class="main"><header class="topbar"><button class="icon" data-action="sidebar" data-icon="sidebar" aria-label="Seitenleiste einblenden oder ausblenden" data-tip="Seitenleiste"></button><div class="breadcrumb"><i data-icon="folder"></i><span id="project-name">Pi Desk</span></div><div class="tools"><button class="icon" data-action="search" data-icon="search" aria-label="Suchen" data-tip="Suchen · Strg+K"></button><button class="icon" data-action="result" data-icon="split" aria-label="Ergebnis einblenden oder ausblenden" data-tip="Ergebnis"></button><button class="icon" data-action="more" data-icon="more" aria-label="Weitere Aktionen" data-tip="Mehr"></button></div></header>
 <div class="workarea"><section class="conversation" aria-label="Unterhaltung"><div class="chat-scroll" id="chat"></div><div class="composer-area"><form class="composer" id="composer"><div id="queued" class="queued"></div><div id="attached" class="attached" hidden></div><textarea id="prompt" rows="2" aria-label="Nachricht an den Agenten" placeholder="Was möchtest du ändern?"></textarea><div class="composer-controls"><button type="button" class="context-trigger" data-action="add-context" aria-label="Kontext hinzufügen" aria-haspopup="dialog" data-tip="Kontext hinzufügen"><i data-icon="plus"></i><span class="context-word">Kontext</span></button><button type="button" class="access-trigger" id="access-trigger" data-action="permissions" aria-label="Genehmigungen: Nachfragen" aria-haspopup="dialog" data-mode="ask" data-tip="Genehmigungen"><i data-icon="shield"></i><span id="access-label">Nachfragen</span></button><button type="button" class="model" data-action="model"><span id="model-label">Modell wählen</span><i data-icon="chevron"></i></button><button type="button" class="icon" id="stop-agent" data-action="stop" aria-label="Agent anhalten" data-tip="Agent anhalten" data-icon="stop" hidden></button><button class="icon send" type="submit" id="send" data-icon="up" aria-label="Nachricht senden" disabled></button></div></form><div class="composer-foot"><span id="composer-status">Verbindung wird hergestellt</span><span><kbd>↵</kbd> Senden</span></div></div></section>
 <aside class="inspector" aria-label="Arbeitsergebnis"><div class="inspector-toolbar"><div class="view-tabs" role="tablist" aria-label="Ergebnisansicht"><button class="icon" role="tab" data-view="preview" aria-selected="true" aria-label="Vorschau" data-tip="Vorschau" data-icon="browser"></button><button class="icon" role="tab" data-view="diff" aria-selected="false" aria-label="Änderungen" data-tip="Änderungen" data-icon="code"></button><button class="icon" role="tab" data-view="files" aria-selected="false" aria-label="Dateien" data-tip="Dateien" data-icon="files"></button></div><div class="spacer"></div><button class="icon" data-action="result" data-icon="close" aria-label="Ergebnis schließen" data-tip="Schließen"></button></div><div id="inspector-body" class="inspector-body" role="tabpanel"></div></aside></div></main>
</div>
<div class="popover" id="popover" popover></div><dialog class="search-panel" id="search-dialog"><div class="search-top"><i data-icon="search"></i><input id="search-input" aria-label="Aufgaben durchsuchen" placeholder="Aufgabe suchen …"><button class="icon" data-action="close-search" data-icon="close" aria-label="Suche schließen"></button></div><div id="search-results" class="search-results"></div></dialog><div class="toast" id="toast" role="status"></div>
<dialog id="connect-dialog" class="connect-dialog" aria-label="Anbieter verbinden"></dialog><script src="/marked.js" defer></script><script src="/purify.js" defer></script><script src="/app.js" defer></script><script src="/features.js" defer></script></body></html>
