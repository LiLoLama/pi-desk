/* Quiet Studio: light catches the controls; content stays unframed. */
:root{--metal-edge:#d6dbd340;--warm-light:#dfcab513;--bubble:#323638;--access-full:#ddbf95}
.sidebar{background:linear-gradient(155deg,#2c2e30 0%,#232527 32%,#202223 100%)}
.topbar{position:relative;background:linear-gradient(100deg,#ffffff02,transparent 65%)}
.topbar:after{content:"";position:absolute;bottom:-1px;left:5%;right:15%;height:1px;background:linear-gradient(90deg,transparent,#ced6cd22,transparent);pointer-events:none}
.brand svg{color:#d3dcd2;filter:drop-shadow(0 1px 1px #0008)}
.task.active{background:linear-gradient(100deg,#c9d4c813,#ffffff06);box-shadow:inset 0 1px 0 #ffffff07}
.message{margin-bottom:32px}.message.user{display:flex;justify-content:flex-end;margin-left:28px;margin-bottom:35px}
.message.user p{display:inline-block;max-width:min(85%,52ch);background:linear-gradient(130deg,#35393a,#2d3132);color:#e9ebe7;border-radius:16px 16px 5px 16px;padding:12px 17px;box-shadow:inset 0 1px 0 #ffffff0a;line-height:1.7;font-size:13px;overflow-wrap:anywhere}
.message:not(.user) p{padding-right:12px;overflow-wrap:anywhere}.who{display:none}
.composer{position:relative;isolation:isolate;background:linear-gradient(150deg,#393e40e8 0%,#2d3234ed 46%,#2b2e30f5 100%);box-shadow:0 12px 32px -12px #0009,inset 0 1px 0 #dce4df29,inset 0 -1px 0 #0004}
.composer:before{content:"";position:absolute;top:0;left:18px;right:18px;height:1px;border-radius:50%;background:linear-gradient(90deg,transparent 4%,#e3d7c758 32%,#b9cbc766 50%,transparent 92%);pointer-events:none}
.composer:focus-within{box-shadow:0 14px 36px -12px #000a,inset 0 1px 0 #d9e5d966,inset 0 0 0 1px #b5c5bf30}
.composer-controls{gap:2px}.context-trigger{display:flex;gap:5px;align-items:center;padding:7px 5px;color:#c7cdca;border-radius:6px;font-size:11px;position:relative;white-space:nowrap}.context-trigger svg{width:16px;height:16px}
.access-trigger{margin-left:2px;display:flex;gap:5px;align-items:center;padding:7px 5px;color:#b9c4bc;font-size:10px;border-radius:6px;position:relative;white-space:nowrap}.access-trigger svg{width:15px;height:15px}.access-trigger[data-mode=full]{color:var(--access-full)}
.model{padding:5px;font-size:10px;white-space:nowrap}.send{box-shadow:0 3px 8px #0003,inset 0 1px 0 #fff}.send:not(:disabled):hover{transform:translateY(-1px);color:#242727}
.attached{display:flex;gap:5px;flex-wrap:wrap;padding:0 2px 9px}.context-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 6px;border-radius:5px;background:#c3d5c310;color:#c3d1c1;font-size:10px;max-width:100%}.context-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.context-chip svg{width:12px;height:12px}.context-chip button{display:inline-flex;padding:2px;color:#bdc5bf;border-radius:3px}
.popover{max-width:calc(100vw - 20px);max-height:70dvh;overflow:auto;box-shadow:0 16px 50px #0007,inset 0 1px 0 #ffffff20;background:linear-gradient(145deg,#373d3ef5,#2c3032fa)}
.popover.context-menu,.popover.permission-menu{width:310px}.popover .menu-title{font-size:12px;color:#ecefeb;font-weight:550;padding:9px 10px 4px}.popover .menu-note{font-size:10px;line-height:1.6;color:#adb5b1;padding:7px 10px;margin:0}.popover .menu-option{align-items:flex-start;padding:11px 10px}.menu-option>svg{margin-top:3px}.menu-option .option-copy{flex:1}.menu-option strong{font-size:12px;font-weight:500;display:block}.menu-option .option-description{display:block;font-size:10px;line-height:1.65;color:#adb5b1;margin-top:2px}.menu-option .selection-mark{width:14px;height:14px;margin-left:auto;color:var(--green);flex-shrink:0}.menu-option[aria-checked=true]{background:#c7d8c908}.menu-divider{height:1px;background:var(--line);margin:5px 10px}.popover .menu-done{justify-content:center;color:#d0dcca;font-size:11px}

/* Motion: purposeful, interruptible, no idle choreography. */
:root{--motion-ease:cubic-bezier(.16,1,.3,1)}
button{transition:background .16s ease,color .16s ease,transform .18s var(--motion-ease)}
.icon:active:not(:disabled),.context-trigger:active,.access-trigger:active{transform:scale(.94)}
.send:active:not(:disabled){transform:scale(.89)}
.composer{transition:box-shadow .28s ease,background .28s ease}
.composer:after{content:"";position:absolute;pointer-events:none;top:0;left:20px;right:20px;height:1px;opacity:0;background:linear-gradient(90deg,transparent 15%,#dfeadd 49%,#eff0e2 51%,transparent 85%);transform:scaleX(.12);transform-origin:left}
.composer.is-sending:after{animation:send-light .62s var(--motion-ease) both}
@keyframes send-light{0%{opacity:0;transform:translateX(0) scaleX(.12)}25%{opacity:.95}100%{opacity:0;transform:translateX(0) scaleX(1)}}
.view-tabs{position:relative}.view-tabs .icon[aria-selected=true]:before{display:none}
.tab-indicator{position:absolute;left:0;bottom:0;width:16px;height:2px;border-radius:2px;background:#cad5cd;pointer-events:none;transition:transform .32s var(--motion-ease),opacity .14s ease}

const tasks=[{id:'booking',project:'Studio Website',title:'Buchungsflow',prompt:'Vereinfache die Buchung auf zwei Schritte.',reply:'Der neue Ablauf ist bereit. Datum wählen, Details ergänzen, fertig.',files:['booking.tsx','DatePicker.tsx','validation.ts','booking.css'],note:'Vorschau und Änderungen sind bereit.'},{id:'home',project:'Studio Website',title:'Startseite',prompt:'Gib der Startseite mehr Ruhe und eine klarere Hierarchie.',reply:'Mehr Raum für das Wesentliche. Die Typografie führt, die Navigation tritt zurück.',files:['page.tsx','navigation.tsx','globals.css'],note:'Drei Dateien für deine Durchsicht.'},{id:'quotes',project:'Studio Website',title:'Testimonials',prompt:'Zeige Kundenstimmen als ruhige, lesbare Liste.',reply:'Die Zitate stehen jetzt frei auf der Seite. Abstand und Typografie ersetzen die Karten.',files:['testimonials.tsx','content.ts'],note:'Zwei Änderungen vorbereitet.'},{id:'finance',project:'Personal Finance',title:'Monatsübersicht',prompt:'Fasse meine Ausgaben übersichtlich zusammen.',reply:'Die Demo-Übersicht ist vorbereitet. Wiederkehrende Ausgaben und einzelne Buchungen sind getrennt.',files:['overview.tsx','transactions.ts'],note:'Nur illustrative Beispieldaten.'},{id:'recipes',project:'Kitchen Recipes',title:'Rezeptsuche',prompt:'Mach die Rezeptsuche einfacher.',reply:'Zutaten und Zubereitungszeit lassen sich jetzt direkt filtern.',files:['search.tsx','filters.ts'],note:'Die neue Suche ist bereit.'}];
let current='booking',view='preview',selectedFile='booking.tsx',agentOpen='',narrow=false,model='Modell wählen',running=false,runTimer,toastTimer,monthOffset=0,selectedDay=18,selectedTime='10:00',bookingStep=1;const extraMessages={},agentCopy={Research:'Recherche abgeschlossen. Zwei Schritte und ein sichtbares Datum halten den Ablauf verständlich.',Build:'Vier Beispieldateien aktualisiert. Die Vorschau zeigt den geplanten Buchungsablauf.',Review:'Demo-Prüfung abgeschlossen. In diesem Mockup wurden keine echten Tests ausgeführt.'};
const contextByTask={},accessByTask={};
const contextOptions=[{id:'rules',name:'AGENTS.md',detail:'Projektregeln',icon:'file'},{id:'booking',name:'booking.tsx',detail:'Aktuelle Datei',icon:'code'},{id:'src',name:'src / components',detail:'Ordner',icon:'folder'},{id:'screenshot',name:'Vorschau.png',detail:'Screenshot',icon:'browser'}];
const accessOptions=[{id:'ask',name:'Nachfragen',icon:'shield',detail:'Änderungen und Befehle jeweils bestätigen.'},{id:'workspace',name:'Projektzugriff',icon:'folder',detail:'Im Projekt arbeiten. Für externe Zugriffe nachfragen.'},{id:'full',name:'Vollzugriff',icon:'lock',detail:'Dateien und Befehle ohne einzelne Rückfragen.'}];
const $=s=>document.querySelector(s);const task=()=>tasks.find(t=>t.id===current);function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3600)}
function renderProjects(){const groups=[...new Set(tasks.map(t=>t.project))];$('#projects').innerHTML=groups.map(p=>`<button class="project" data-project="${esc(p)}">${icon('folder')}<span>${esc(p)}</span>${icon(task().project===p?'chevron':'right','arrow')}</button>${task().project===p?`<div class="tasks">${tasks.filter(t=>t.project===p).map(t=>`<button class="task ${t.id===current?'active':''}" data-task="${t.id}" ${t.id===current?'aria-current="page"':''}>${icon('file')}<span>${esc(t.title)}</span>${t.id===current?'<span class="dot"></span>':''}</button>`).join('')}</div>`:''}`).join('');$('#project-name').textContent=task().project}
function fileRows(){return task().files.map((f,i)=>`<button class="file-row" data-file="${esc(f)}">${icon('file')}<span>${esc(f)}</span><span class="stats"><span class="plus">+${[38,24,16,6][i]||8}</span><span class="minus">−${[12,4,5,2][i]||2}</span></span></button>`).join('')}
function renderChat(){const t=task();$('#chat').innerHTML=`<div class="heading"><h1>${esc(t.title)}</h1><span class="branch">${icon('branch')}main</span></div>${t.fresh?'<div class="empty"><p>Eine Idee reicht. Was möchtest du umsetzen?</p></div>':`<div class="message user" aria-label="Deine Nachricht"><p>${esc(t.prompt)}</p></div><div class="message assistant" aria-label="Agentenantwort"><p>${esc(t.reply)}</p></div><div class="agent-flow">${['Research','Build','Review'].map((a,i)=>`${i?'<span class="connector"></span>':''}<button class="agent" data-agent="${a}" aria-label="${a}: Demodetails anzeigen" aria-expanded="${agentOpen===a}" data-tip="${a}">${icon(['search','code','shield'][i])}${icon('check','check')}</button>`).join('')}</div>${agentOpen?`<div class="agent-detail">${esc(agentCopy[agentOpen])}</div>`:''}<button class="file-summary" data-action="files">${icon('files')}<span>${t.files.length} Dateien</span><span class="stats"><span class="plus">+84</span><span class="minus">−23</span></span>${icon('right')}</button><div class="file-list">${fileRows()}</div><div class="summary-note">${icon('check')}${esc(t.note)}</div>`}${(extraMessages[current]||[]).map(m=>`<div class="message ${m.role==='Du'?'user':'assistant'}" style="margin-top:30px" aria-label="${m.role==='Du'?'Deine Nachricht':'Agentenantwort'}"><p>${esc(m.text)}</p></div>`).join('')}${running?`<div class="loading-line" style="margin-top:22px">${icon('refresh')}Demo-Antwort wird vorbereitet …</div>`:''}`}
function selectTask(id){if(running)stopRun();current=id;agentOpen='';selectedFile=task().files[0]||'';syncComposer();$('#prompt').value='';$('#send').disabled=true;document.body.classList.remove('sidebar-open');renderProjects();renderChat();renderInspector()}
function setView(v){view=v;document.body.classList.remove('no-inspector');document.body.classList.add('show-result');document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===v));renderInspector()}
function firstWeekday(){const d=new Date(2026,8+monthOffset,1);return d.getDay()===6?3:d.getDay()===0?2:1}
function bookingMarkup(){const d=new Date(2026,8+monthOffset,1),month=d.toLocaleDateString('de-AT',{month:'long',year:'numeric'}),days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),offset=(d.getDay()+6)%7;return `<div class="site-nav"><span class="studio-logo" style="text-transform:none;letter-spacing:-.04em;color:#353832;font-size:21px">Studio.</span><span>Raum für gute Ideen</span></div><div class="site-head"><h2>Ein guter<br>Anfang.</h2><p>Dein Projekt. Unsere volle Aufmerksamkeit.<br>Finde einen Moment für ein Gespräch.</p></div><div class="booking-steps"><span class="${bookingStep===1?'active':''}"><b>1</b>Termin</span><span class="${bookingStep===2?'active':''}"><b>2</b>Details</span></div>${bookingStep===1?`<div class="month"><button class="icon" data-action="prev-month" aria-label="Voriger Monat">${icon('left')}</button>${month}<button class="icon" data-action="next-month" aria-label="Nächster Monat">${icon('right')}</button></div><div class="calendar">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<span class="weekday">${x}</span>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:days},(_,i)=>`<button class="day ${selectedDay===i+1?'selected':''}" data-day="${i+1}" aria-label="${i+1}. ${month}" aria-pressed="${selectedDay===i+1}" ${[5,6].includes((offset+i)%7)?'disabled':''}>${i+1}</button>`).join('')}</div><div class="times">${['10:00','11:30','14:00','16:30'].map(t=>`<button class="time ${selectedTime===t?'selected':''}" data-time="${t}" aria-pressed="${selectedTime===t}">${t}</button>`).join('')}</div><button class="continue" data-action="booking-next">Weiter ${icon('arrow')}</button>`:bookingStep===2?`<form class="booking-form" id="booking-form"><label for="book-name">Name</label><input id="book-name" required autocomplete="off" placeholder="Dein Name"><label for="book-email">E-Mail</label><input id="book-email" type="email" required autocomplete="off" placeholder="du@studio.at"><button class="continue" type="submit">Termin vormerken ${icon('arrow')}</button><button class="back" type="button" data-action="booking-back">Zurück zur Terminauswahl</button></form>`:`<div class="booking-success">${icon('check')}<h3>Wir freuen uns.</h3><p>${selectedDay}. ${month} · ${selectedTime} Uhr</p><p>Demo abgeschlossen. Keine Buchung versendet.</p><button data-action="booking-reset">Noch einmal ausprobieren</button></div>`}<div class="site-footer"><span>30 MINUTEN · UNVERBINDLICH</span><span>STUDIO / WIEN</span></div>`}
function renderInspector(){const el=$('#inspector-body');if(view==='preview'){el.innerHTML=`<div class="browser-bar"><button class="icon" data-action="preview-reset" aria-label="Vorschau zurücksetzen">${icon('refresh')}</button><span class="url">${icon('lock')}studio.local / preview</span><button class="icon" data-action="focus-preview" aria-label="Vorschau fokussieren">${icon('expand')}</button></div><div class="preview ${narrow?'mobile':''}" id="preview">${task().id==='booking'?bookingMarkup():task().fresh?'<div class="site-head"><h2>Raum für<br>deine Idee.</h2><p>Die Vorschau erscheint hier, sobald ein Ergebnis vorliegt.</p></div>':`<div class="site-nav"><span class="studio-logo">${esc(task().project)}</span></div><div class="site-head"><h2>${esc(task().title)}.</h2><p>${esc(task().reply)}</p></div><div class="booking-success">${icon('check')}<p>Alternative Beispielansicht</p></div>`}</div><div class="preview-bottom">${icon('file')}<span>${esc(selectedFile||'Noch keine Datei')}</span><button class="icon" data-action="diff" aria-label="Dateiänderungen öffnen">${icon('code')}</button></div>`}else if(view==='diff'){el.innerHTML=`<div class="diff-header">${icon('file')}<select id="diff-file" aria-label="Datei für Diff auswählen">${task().files.map(f=>`<option ${f===selectedFile?'selected':''}>${esc(f)}</option>`).join('')}</select><span class="stats"><span class="plus">+38</span><span class="minus">−12</span></span></div><div class="code">${diffLines().map((l,i)=>`<div class="${l[0]}"><span class="num">${i+24}</span>${esc(l[1])}</div>`).join('')}</div><p class="diff-note">Beispiel-Diff · ${esc(selectedFile||'Keine Datei ausgewählt')}</p>`}else if(view==='files'){el.innerHTML=`<div class="files-view"><h2>Änderungen</h2>${task().files.length?fileRows():'<p class="diff-note">Noch keine Dateien in dieser Aufgabe.</p>'}<p class="diff-note">Wähle eine Datei für die Diff-Ansicht.</p></div>`}else if(view==='settings'){el.innerHTML=`<div class="settings-view"><h2>Einstellungen</h2><div class="setting"><div>Quiet Studio<p>Dunkel · reduzierte Oberfläche</p></div>${icon('check')}</div><div class="setting"><div>Kompakte Abstände<p>Mehr Inhalt im Gespräch</p></div><button class="switch" role="switch" aria-label="Kompakte Abstände" aria-checked="${document.body.classList.contains('compact')}" data-action="compact"></button></div><div class="setting"><div>Agentenverbindung<p>Im Design-Prototyp nicht verbunden</p></div>${icon('lock')}</div><p class="diff-note">Alle Interaktionen verwenden lokale Beispieldaten. Es werden keine Nachrichten, Dateien oder Buchungen versendet.</p></div>`}}

function diffLines(){if(!selectedFile)return[];return [['','export function Booking() {'],['','  return ('],['','    <main>'],['del','−     <h1>Book a Session</h1>'],['add','+     <h1>Ein guter Anfang.</h1>'],['',''],['del','−     <BookingForm steps={4} />'],['add','+     <DatePicker value={date} />'],['add','+     <TimeSlots value={time} />'],['',''],['add','+     <Button onClick={next}>'],['add','+       Weiter'],['add','+     </Button>'],['','    </main>'],['','  );'],['','}']]}
function placePopover(anchor,kind=''){const p=$('#popover');p.className='popover '+kind;p.showPopover();const r=anchor.getBoundingClientRect();p.style.left=Math.max(10,Math.min(r.left,innerWidth-p.offsetWidth-12))+'px';p.style.top=(r.bottom+p.offsetHeight+15>innerHeight?Math.max(10,r.top-p.offsetHeight-8):r.bottom+8)+'px'}
function menu(anchor,items,caption=''){const p=$('#popover');p.setAttribute('role','dialog');p.setAttribute('aria-label',caption||'Aktionen');p.innerHTML=(caption?`<small>${esc(caption)}</small>`:'')+items.map(x=>`<button data-menu="${x[0]}">${icon(x[2]||'check')}${esc(x[1])}</button>`).join('');placePopover(anchor)}
function syncComposer(){const chosen=contextByTask[current]||[];$('#attached').hidden=!chosen.length;$('#attached').innerHTML=chosen.map(id=>{const c=contextOptions.find(x=>x.id===id);return `<span class="context-chip">${icon(c.icon)}<span>${esc(c.name)}</span><button type="button" data-remove-context="${id}" aria-label="${esc(c.name)} aus Kontext entfernen">${icon('close')}</button></span>`}).join('');const mode=accessOptions.find(x=>x.id===(accessByTask[current]||'ask'));const b=$('#access-trigger');b.dataset.mode=mode.id;b.setAttribute('aria-label','Genehmigungen: '+mode.name);b.innerHTML=icon(mode.icon)+`<span id="access-label">${mode.name}</span>`}
function contextMenu(anchor){const p=$('#popover'),chosen=contextByTask[current]||[];p.setAttribute('role','dialog');p.setAttribute('aria-label','Kontext hinzufügen');p.innerHTML='<div class="menu-title">Kontext hinzufügen</div><p class="menu-note">Wähle, was diese Aufgabe kennen soll.</p>'+contextOptions.map(c=>`<button type="button" class="menu-option" role="checkbox" aria-checked="${chosen.includes(c.id)}" data-context="${c.id}">${icon(c.icon)}<span class="option-copy"><strong>${esc(c.name)}</strong><span class="option-description">${c.detail}</span></span>${chosen.includes(c.id)?icon('check','selection-mark'):'<span class="selection-mark"></span>'}</button>`).join('')+'<div class="menu-divider"></div><p class="menu-note">Beispieldateien · keine lokalen Dateien gelesen.</p><button class="menu-done" data-action="close-popover">Fertig</button>';placePopover(anchor,'context-menu')}
function permissionMenu(anchor){const p=$('#popover');p.setAttribute('role','dialog');p.setAttribute('aria-label','Genehmigungen');p.innerHTML='<div class="menu-title">Genehmigungen</div><div role="radiogroup" aria-label="Zugriffsmodus">'+accessOptions.map(c=>`<button type="button" class="menu-option" role="radio" aria-checked="${(accessByTask[current]||'ask')===c.id}" data-permission="${c.id}">${icon(c.icon)}<span class="option-copy"><strong>${c.name}</strong><span class="option-description">${c.detail}</span></span>${(accessByTask[current]||'ask')===c.id?icon('check','selection-mark'):'<span class="selection-mark"></span>'}</button>`).join('')+'</div><div class="menu-divider"></div><p class="menu-note">Nur Design-Demo. Diese Auswahl erteilt keine echten Berechtigungen.</p>';placePopover(anchor,'permission-menu')}

function search(){const d=$('#search-dialog');d.showModal();$('#search-input').value='';searchResults('');$('#search-input').focus()}
function searchResults(q){const found=tasks.filter(t=>(t.title+' '+t.project).toLowerCase().includes(q.toLowerCase()));$('#search-results').innerHTML=found.length?found.map(t=>`<button data-search-task="${t.id}">${icon('file')}${esc(t.title)}<span>${esc(t.project)}</span></button>`).join(''):'<p class="diff-note">Keine passende Aufgabe gefunden.</p>'}
function stopRun(){clearTimeout(runTimer);running=false;$('#send').innerHTML=icon('up');$('#send').setAttribute('aria-label','Demo-Nachricht senden');$('#send').disabled=!$('#prompt').value.trim();$('#composer-status').textContent='Lokal · Beispieldaten';renderChat()}
$('#composer').addEventListener('submit',e=>{e.preventDefault();if(running){stopRun();toast('Demo angehalten');return}const txt=$('#prompt').value.trim();if(!txt)return;const id=current;(extraMessages[id]??=[]).push({role:'Du',text:txt});$('#prompt').value='';running=true;$('#send').innerHTML=icon('stop');$('#send').setAttribute('aria-label','Demo-Antwort stoppen');$('#composer-status').textContent='Demo läuft';renderChat();$('#chat').scrollTop=$('#chat').scrollHeight;runTimer=setTimeout(()=>{extraMessages[id].push({role:'Pi',text:'So könnte die Antwort hier erscheinen. Deine Anweisung ist im Mockup sichtbar; echte Dateien bleiben unverändert.'});stopRun();$('#chat').scrollTop=$('#chat').scrollHeight},1500)});
$('#prompt').addEventListener('input',()=>{$('#send').disabled=!running&&!$('#prompt').value.trim()});$('#prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('#composer').requestSubmit()}});$('#search-input').addEventListener('input',e=>searchResults(e.target.value));document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();search()}if(e.key==='Escape')document.body.classList.remove('sidebar-open')});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.context){const id=b.dataset.context;const list=contextByTask[current]??=[];contextByTask[current]=list.includes(id)?list.filter(x=>x!==id):[...list,id];syncComposer();contextMenu(document.querySelector('[data-action="add-context"]'));document.querySelector(`[data-context="${id}"]`).focus();return}if(b.dataset.removeContext){contextByTask[current]=(contextByTask[current]||[]).filter(x=>x!==b.dataset.removeContext);syncComposer();return}if(b.dataset.permission){accessByTask[current]=b.dataset.permission;syncComposer();$('#popover').hidePopover();$('#access-trigger').focus();return}if(b.dataset.task){selectTask(b.dataset.task);return}if(b.dataset.project){selectTask(tasks.find(t=>t.project===b.dataset.project).id);return}if(b.dataset.view){setView(b.dataset.view);return}if(b.dataset.file){selectedFile=b.dataset.file;setView('diff');return}if(b.dataset.agent){agentOpen=agentOpen===b.dataset.agent?'':b.dataset.agent;renderChat();return}if(b.dataset.searchTask){$('#search-dialog').close();selectTask(b.dataset.searchTask);return}if(b.dataset.day){selectedDay=+b.dataset.day;renderInspector();return}if(b.dataset.time){selectedTime=b.dataset.time;renderInspector();return}if(b.dataset.menu){const m=b.dataset.menu;$('#popover').hidePopover();if(m.startsWith('model:')){model=m.slice(6);$('#model-label').textContent=model;toast('Modellauswahl nur für die Demo')}if(m==='rename'){task().title=task().title.endsWith(' · Entwurf')?task().title.replace(' · Entwurf',''):task().title+' · Entwurf';renderProjects();renderChat()}if(m==='reset'){extraMessages[current]=[];renderChat();toast('Demo-Verlauf zurückgesetzt')}if(m==='export'){const blob=new Blob([JSON.stringify({task:task(),messages:extraMessages[current]||[]},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pi-desk-demo.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}return}const a=b.dataset.action;switch(a){case'search':search();break;case'close-search':$('#search-dialog').close();break;case'sidebar':if(innerWidth<=600)document.body.classList.toggle('sidebar-open');else document.body.classList.toggle('no-sidebar');break;case'result':if(innerWidth<=900){document.body.classList.remove('no-inspector');document.body.classList.toggle('show-result')}else document.body.classList.toggle('no-inspector');break;case'new':{const id='new-'+Date.now();tasks.push({id,project:task().project,title:'Neue Aufgabe',fresh:true,files:[]});selectTask(id);$('#prompt').focus();break}case'add-project':{const id='project-'+Date.now();tasks.push({id,project:'Neues Projekt '+(tasks.filter(t=>t.fresh).length+1),title:'Neue Aufgabe',fresh:true,files:[]});selectTask(id);toast('Demoprojekt hinzugefügt');break}case'files':setView('files');break;case'diff':setView('diff');break;case'settings':setView('settings');break;case'add-context':contextMenu(b);break;case'permissions':permissionMenu(b);break;case'close-popover':$('#popover').hidePopover();document.querySelector('[data-action="add-context"]').focus();break;case'compact':document.body.classList.toggle('compact');renderInspector();break;case'about':toast('Lokaler Design-Prototyp. Keine Agenten verbunden.');break;case'more':menu(b,[['rename','Aufgabentitel variieren','compose'],['export','Demo-Verlauf exportieren','file'],['reset','Demo-Verlauf zurücksetzen','refresh']]);break;case'model':menu(b,[['model:Standard','Standard','spark'],['model:Schnell','Schnell','arrow'],['model:Lokal','Lokal','terminal']],'Illustrative Modellprofile');break;case'device':narrow=!narrow;b.setAttribute('aria-pressed',narrow);view='preview';setView(view);break;case'preview-reset':bookingStep=1;monthOffset=0;selectedDay=18;selectedTime='10:00';renderInspector();toast('Vorschau zurückgesetzt');break;case'focus-preview':document.body.classList.toggle('no-sidebar');toast('Platz für die Vorschau angepasst');break;case'prev-month':monthOffset--;selectedDay=firstWeekday();renderInspector();break;case'next-month':monthOffset++;selectedDay=firstWeekday();renderInspector();break;case'booking-next':bookingStep=2;renderInspector();break;case'booking-back':case'booking-reset':bookingStep=1;renderInspector();break}});
document.addEventListener('change',e=>{if(e.target.id==='diff-file'){selectedFile=e.target.value;renderInspector()}});document.addEventListener('submit',e=>{if(e.target.id==='booking-form'){e.preventDefault();bookingStep=3;renderInspector()}});document.querySelector('.view-tabs').addEventListener('keydown',e=>{if(!['ArrowRight','ArrowLeft'].includes(e.key))return;e.preventDefault();const tabs=[...document.querySelectorAll('[data-view]')];const i=tabs.indexOf(document.activeElement);const next=tabs[(i+(e.key==='ArrowRight'?1:2))%3];next.focus();setView(next.dataset.view)});

// All transitions are scoped to the changed region; no animation on first load.
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)');
let motionReady=false,lastChatTask='',lastMessageCount=0,lastAgent='',lastInspectorKey='',lastContextIds=[],lastAccess='';
const motionNodes=new Set();
function move(el,frames,duration=280,options={}){
 if(!el||!motionReady||!el.getClientRects().length)return;
 el.getAnimations().filter(a=>a.id==='pi-motion').forEach(a=>a.cancel());
 const reduced=reduceMotion.matches;
 const animation=el.animate(reduced?[{opacity:.7},{opacity:1}]:frames,{duration:reduced?80:duration,easing:'cubic-bezier(.16,1,.3,1)',...options});
 animation.id='pi-motion';motionNodes.add(el);animation.finished.catch(()=>{}).finally(()=>motionNodes.delete(el));return animation;
}
reduceMotion.addEventListener('change',()=>{if(reduceMotion.matches){motionNodes.forEach(el=>el.getAnimations().filter(a=>a.id==='pi-motion').forEach(a=>a.cancel()));$('#composer').classList.remove('is-sending')}});
function appear(el,y=8,duration=280){return move(el,[{opacity:0,transform:`translateY(${y}px)`,filter:'blur(2px)'},{opacity:1,transform:'translateY(0)',filter:'blur(0px)'}],duration)}
function indicator(){const tabs=$('.view-tabs');let line=tabs.querySelector('.tab-indicator');if(!line){line=document.createElement('span');line.className='tab-indicator';line.setAttribute('aria-hidden','true');tabs.append(line)}const active=tabs.querySelector('[aria-selected=true]');line.style.opacity=active?'1':'0';if(active)line.style.transform=`translateX(${active.offsetLeft+9}px)`}
const originalChat=renderChat;
renderChat=function(){const sc=$('#chat'),previousScroll=sc.scrollTop,sameTask=lastChatTask===current,count=(extraMessages[current]||[]).length,newMessage=sameTask&&count>lastMessageCount;originalChat();
 if(sameTask&&!newMessage)sc.scrollTop=previousScroll;
 if(!sameTask){appear(sc,7,250)}
 else if(newMessage){const messages=[...sc.querySelectorAll('.message')],last=messages.at(-1);if(last?.classList.contains('user')){move(last,[{opacity:0,transform:'translateY(24px) scale(.975)'},{opacity:1,transform:'translateY(0) scale(1)'}],420);if(!reduceMotion.matches){const c=$('#composer');c.classList.remove('is-sending');void c.offsetWidth;c.classList.add('is-sending')}}else appear(last,12,420)}
 else if(agentOpen&&agentOpen!==lastAgent)appear(sc.querySelector('.agent-detail'),-5,240);
 lastChatTask=current;lastMessageCount=count;lastAgent=agentOpen;
};
$('#composer').addEventListener('animationend',e=>{if(e.animationName==='send-light')$('#composer').classList.remove('is-sending')});
const originalInspector=renderInspector;
renderInspector=function(){const key=[current,view,view==='diff'?selectedFile:'',bookingStep,monthOffset,narrow].join('|');originalInspector();if(key!==lastInspectorKey){move($('#inspector-body'),[{opacity:.3,transform:'translateX(10px)'},{opacity:1,transform:'translateX(0)'}],300)}lastInspectorKey=key;indicator()};
const originalSync=syncComposer;
syncComposer=function(){const previousTop=$('#composer').getBoundingClientRect().top;originalSync();const ids=contextByTask[current]||[];for(const chip of $('#attached').querySelectorAll('.context-chip')){const id=chip.querySelector('[data-remove-context]').dataset.removeContext;if(!lastContextIds.includes(id))move(chip,[{opacity:0,transform:'translateY(5px) scale(.94)'},{opacity:1,transform:'translateY(0) scale(1)'}],260)}const newTop=$('#composer').getBoundingClientRect().top;if(motionReady&&Math.abs(previousTop-newTop)>1)move($('#composer'),[{transform:`translateY(${previousTop-newTop}px)`},{transform:'translateY(0)'}],280);const access=accessByTask[current]||'ask';if(lastAccess&&lastAccess!==access)appear($('#access-trigger'),2,180);lastAccess=access;lastContextIds=[...ids]};
const originalPlace=placePopover;
placePopover=function(anchor,kind=''){const p=$('#popover'),wasOpen=p.matches(':popover-open');originalPlace(anchor,kind);if(!wasOpen){const r=anchor.getBoundingClientRect(),pr=p.getBoundingClientRect();p.style.transformOrigin=`${Math.max(15,Math.min(pr.width-15,r.left+r.width/2-pr.left))}px ${pr.bottom<=r.top?'bottom':'top'}`;move(p,[{opacity:0,transform:'translateY(6px) scale(.955)',filter:'blur(2px)'},{opacity:1,transform:'translateY(0) scale(1)',filter:'blur(0px)'}],280)}};
const originalSearch=search;
search=function(){originalSearch();move($('#search-dialog'),[{opacity:0,transform:'translateX(-50%) translateY(-9px) scale(.98)'},{opacity:1,transform:'translateX(-50%) translateY(0) scale(1)'}],240)};
// FLIP horizontal shifts keeps the layout responsive without animating widths.
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!['sidebar','result','focus-preview'].includes(b.dataset.action))return;const nodes=[$('.conversation'),$('.composer-area'),$('.inspector')],before=nodes.map(el=>el.getBoundingClientRect());requestAnimationFrame(()=>nodes.forEach((el,i)=>{const after=el.getBoundingClientRect();if(!after.width)return;if(!before[i].width){appear(el,0,240);return}const dx=before[i].left-after.left;if(Math.abs(dx)>1)move(el,[{transform:`translateX(${dx}px)`},{transform:'translateX(0)'}],330)}))},true);
window.addEventListener('resize',indicator);

icons();syncComposer();renderProjects();renderChat();renderInspector();motionReady=true;
</script>
</body>
